# Static-site Apache config template (cPanel public_html).
# Copied into out/ by `next build` and uploaded with the site. Everything here is .htaccess-legal:
# no ServerSignature/ServerTokens (server config only — a 500 if set here).
# Template from the Convenium Studio deploy (2026-10-09). Replace example.com.

Options -Indexes -MultiViews
DirectoryIndex index.html
ErrorDocument 404 /404.html
AddDefaultCharset utf-8

# ---------------------------------------------------------------- MIME types
<IfModule mod_mime.c>
  AddType image/webp                  .webp
  AddType image/avif                  .avif
  AddType video/mp4                   .mp4
  AddType video/webm                  .webm
  AddType model/gltf-binary           .glb
  AddType font/woff2                  .woff2
  AddType application/manifest+json   .webmanifest
  AddType text/plain                  .txt
  AddCharset utf-8 .html .css .js .json .txt .xml .svg .webmanifest
</IfModule>
# Next exports the favicon and touch icon (app/icon.tsx, app/apple-icon.tsx) as extensionless
# files. Without this they go out with no image type, and nosniff makes browsers drop them.
<FilesMatch "^(icon|apple-icon)$">
  ForceType image/png
  <IfModule mod_headers.c>
    Header set Cache-Control "public, max-age=2592000"
  </IfModule>
</FilesMatch>

# ---------------------------------------------------------------- redirects
<IfModule mod_rewrite.c>
  RewriteEngine On

  # AutoSSL / ACME domain validation must never be redirected or blocked.
  RewriteRule ^\.well-known/(acme-challenge|pki-validation)/ - [L]

  # Hidden files (.git, .env, .DS_Store …) are never served; /.well-known/ is the exception.
  RewriteRule (^|/)\.(?!well-known(/|$)) - [F]

  # HTTPS-GATE — keep commented until AutoSSL has issued a certificate for example.com AND
  # www.example.com and https:// loads cleanly in a browser (runbook: HTTPS step).
  # A redirect to https before the certificate exists takes the whole site down.
  # RewriteCond %{HTTPS} !=on
  # RewriteRule ^ https://example.com%{REQUEST_URI} [R=301,L]

  # www → apex, keeping the scheme the visitor used (https once the gate above is on).
  RewriteCond %{HTTP_HOST} ^www\.example\.com$ [NC]
  RewriteRule ^ %{REQUEST_SCHEME}://example.com%{REQUEST_URI} [R=301,L]
</IfModule>

# ---------------------------------------------------------------- security headers
<IfModule mod_headers.c>
  # HTTPS-GATE — switch on together with the redirect above. Start at 300 s; raise to
  # max-age=31536000 after two weeks of clean HTTPS. No includeSubDomains/preload: the
  # Microsoft 365 records (autodiscover etc.) live on subdomains this host does not serve.
  # <If "%{HTTPS} == 'on'">
  #   Header always set Strict-Transport-Security "max-age=300"
  # </If>

  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "DENY"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  # Every powerful feature off; only what the site uses (muted autoplay loops, video fullscreen) stays on for itself.
  Header always set Permissions-Policy "accelerometer=(), autoplay=(self), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"

  # CSP — REPORT-ONLY. The enforced policy is still the <meta> tag in your layout
  # (tested: 0 violations). This header is the same policy plus frame-ancestors, which a meta tag
  # cannot carry. Check the browser console on every route (runbook: CSP step), then
  # rename to Content-Security-Policy, add upgrade-insecure-requests, and drop the meta tag.
  Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

  # ------------------------------------------------------------ caching
  # HTML and RSC payloads: always revalidate, so a deploy is visible on the next load.
  <FilesMatch "\.(html|txt|xml|json|webmanifest)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  # Media and fonts in public/ are not content-hashed: 30 days. Replacing one means a new file name.
  <FilesMatch "\.(jpe?g|png|gif|webp|avif|svg|ico|mp4|webm|glb|woff2?|ttf|otf)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
  # Next's build output is content-hashed: cache for a year, never revalidate.
  # (<If> merges after <FilesMatch>, so it wins for fonts and images under _next/static.)
  <If "%{REQUEST_URI} =~ m#^/_next/static/#">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </If>
</IfModule>

# ---------------------------------------------------------------- compression
<IfModule mod_brotli.c>
  AddOutputFilterByType BROTLI_COMPRESS text/html text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml model/gltf-binary
</IfModule>
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml model/gltf-binary
</IfModule>
